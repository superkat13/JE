name: Verify final Sage 1.30.1

on:
  push:
    branches:
      - sage-final-v1-30-1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sage-final-1301:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Verify Forge 0.3.1 and all inherited Forge tests
        run: |
          set -euo pipefail
          python3 -m py_compile sage_patches/*.py sage_tests/*.py sage_forge/*.py sage_forge/tests/*.py
          python3 -m unittest discover -v -s sage_forge/tests -t .
          python3 - <<'PY'
          import sage_forge
          from sage_forge.server import ForgeRequestHandler
          assert sage_forge.__version__ == "0.3.1"
          assert ForgeRequestHandler.server_version == "SageForge/0.3.1"
          registry = sage_forge._tools.default_registry()
          ids = {item["tool_id"] for item in registry.public_definitions()}
          assert "developer.autonomy_dispatch" in ids
          assert "developer.autonomy_result" in ids
          print("Forge 0.3.1 compatibility pair verified")
          PY

      - name: Prove inherited Sage 1.29 checkpoint
        run: |
          set -euo pipefail
          bash sage_tools/reconstruct_v1_29.sh sage_build_129_baseline
          for test_file in sage_tests/test_*_v1_29.py; do
            echo "=== $test_file ==="
            python3 "$test_file" sage_build_129_baseline
          done

      - name: Prove inherited Sage 1.30 checkpoint
        run: |
          set -euo pipefail
          bash sage_tools/reconstruct_v1_30.sh sage_build_130_baseline
          for test_file in sage_tests/test_*_v1_30.py; do
            echo "=== $test_file ==="
            python3 "$test_file" sage_build_130_baseline
          done

      - name: First final Sage 1.30.1 reconstruction
        run: |
          set -euo pipefail
          bash sage_tools/reconstruct_v1_30_1.sh sage_build_1301_a
          python3 sage_tests/test_forge_compatibility_v1_30_1.py sage_build_1301_a

      - name: Inherited continuity regression pass
        run: |
          set -euo pipefail
          bash sage_tools/reconstruct_v1_28.sh sage_build_128
          for test_file in \
            sage_tests/test_stabilization_v1_21.py \
            sage_tests/test_android_compat_v1_21.py \
            sage_tests/test_brain_watchdog_v1_22.py \
            sage_tests/test_wake_profiles_and_recognition_v1_23.py \
            sage_tests/test_wake_profiles_compile_repair_v1_23.py \
            sage_tests/test_continuity_report_v1_24.py \
            sage_tests/test_number_overlay_release_v1_24_1.py \
            sage_tests/test_sage_release_v1_24_2.py \
            sage_tests/test_self_repair_v1_25.py \
            sage_tests/test_workbench_v1_25.py \
            sage_tests/test_sage_forge_v1_25.py \
            sage_tests/test_reliability_toolbelt_v1_26.py \
            sage_tests/test_continuity_finish_v1_26.py \
            sage_tests/test_intelligence_memory_v1_27.py \
            sage_tests/test_living_sage_v1_28.py \
            sage_tests/test_red_queen_v1_28.py \
            sage_tests/test_orchestrator_registry_v1_28.py \
            sage_tests/test_package_file_labs_v1_28.py \
            sage_tests/test_network_operations_v1_28.py \
            sage_tests/test_automation_v1_28.py; do
            python3 "$test_file" sage_build_128
          done
          python3 sage_tests/test_public_disclosure_v1_27.py

      - name: Second independent final Sage 1.30.1 reconstruction
        run: |
          set -euo pipefail
          bash sage_tools/reconstruct_v1_30_1.sh sage_build_1301_b
          python3 sage_tests/test_forge_compatibility_v1_30_1.py sage_build_1301_b
          diff -qr --exclude=build --exclude=.gradle sage_build_1301_a/app/src sage_build_1301_b/app/src
          cmp sage_build_1301_a/app/build.gradle.kts sage_build_1301_b/app/build.gradle.kts

      - name: Add exact pinned native Brain and offline wake model to both passes
        run: |
          set -euo pipefail
          mkdir -p sage_build_1301_a/third_party/llama.cpp
          git -C sage_build_1301_a/third_party/llama.cpp init
          git -C sage_build_1301_a/third_party/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C sage_build_1301_a/third_party/llama.cpp fetch --depth=1 origin d73c1d6b22a2d3ecc74c2c9cde354015ee72e862
          git -C sage_build_1301_a/third_party/llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C sage_build_1301_a/third_party/llama.cpp rev-parse HEAD)" = d73c1d6b22a2d3ecc74c2c9cde354015ee72e862
          mkdir -p /tmp/sage-vosk-1301 sage_build_1301_a/app/src/main/assets
          curl -L --fail --retry 3 --retry-delay 2 -o /tmp/sage-vosk-1301.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q /tmp/sage-vosk-1301.zip -d /tmp/sage-vosk-1301
          mv /tmp/sage-vosk-1301/vosk-model-small-en-us-0.15 sage_build_1301_a/app/src/main/assets/model-en-us
          printf 'sage-v1.30.1-final-forge-compatibility\n' > sage_build_1301_a/app/src/main/assets/model-en-us/uuid
          test -s sage_build_1301_a/app/src/main/assets/model-en-us/am/final.mdl
          mkdir -p sage_build_1301_b/third_party sage_build_1301_b/app/src/main/assets
          cp -a sage_build_1301_a/third_party/llama.cpp sage_build_1301_b/third_party/llama.cpp
          cp -a sage_build_1301_a/app/src/main/assets/model-en-us sage_build_1301_b/app/src/main/assets/model-en-us

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Verify permanent Sage signer before build
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode sage_signing/android-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          ACTUAL="$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)"
          EXPECTED="$(printf '%s%s' '99e0a7c655cdefb3bb4ac85e5961d193' '58ee0ffdb3dce9b3a145f9cbcda78d35')"
          test "$ACTUAL" = "$EXPECTED"

      - name: Install exact Android compile toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;28.2.13676358"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Compile test and lint first final pass
        working-directory: sage_build_1301_a
        run: |
          set -euo pipefail
          gradle :app:compileReleaseJavaWithJavac --stacktrace
          gradle :app:externalNativeBuildRelease --stacktrace
          gradle :app:testReleaseUnitTest --stacktrace
          gradle :app:lintRelease --stacktrace

      - name: Compile test and lint second final pass
        working-directory: sage_build_1301_b
        run: |
          set -euo pipefail
          gradle :app:compileReleaseJavaWithJavac --stacktrace
          gradle :app:externalNativeBuildRelease --stacktrace
          gradle :app:testReleaseUnitTest --stacktrace
          gradle :app:lintRelease --stacktrace

      - name: Assemble install-over-existing final APK
        working-directory: sage_build_1301_a
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --stacktrace
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee ../sage-1301-apksigner.txt
          EXPECTED="$(printf '%s%s' '99e0a7c655cdefb3bb4ac85e5961d193' '58ee0ffdb3dce9b3a145f9cbcda78d35')"
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' ../sage-1301-apksigner.txt | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL" = "$EXPECTED"
          unzip -l "$APK" | grep -F 'assets/model-en-us/am/final.mdl' | tee ../sage-1301-wake-asset.txt
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libsage-brain.so' | tee ../sage-1301-native-brain.txt
          sha256sum "$APK" | tee ../Sage-Commander-1.30.1-final.sha256
          cp "$APK" ../Sage-Commander-1.30.1-final.apk

      - name: Final APK identity and compatibility verification
        run: |
          set -euo pipefail
          APK="Sage-Commander-1.30.1-final.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee sage-1301-badging.txt
          grep -F "package: name='com.pineapple.sagecommander.stable'" sage-1301-badging.txt
          grep -F "versionCode='43'" sage-1301-badging.txt
          grep -F "versionName='1.30.1'" sage-1301-badging.txt
          grep -F "application-label:'Sage Commander 1.30.1'" sage-1301-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -t "$APK" >/dev/null
          grep -F 'Check Forge autonomy compatibility' sage_build_1301_a/app/src/main/java/com/pineapple/sage/SageForgeActivity.java
          grep -F 'requireForgeAutonomyReady' sage_build_1301_a/app/src/main/java/com/pineapple/sage/SageAutonomyActivity.java
          grep -F 'developer.autonomy_dispatch' sage_build_1301_a/app/src/main/java/com/pineapple/sage/SageForgeClient.java
          grep -F 'developer.autonomy_result' sage_build_1301_a/app/src/main/java/com/pineapple/sage/SageForgeClient.java
          grep -F 'FIVE_MINUTES_MS = 5L * 60L * 1000L' sage_build_1301_a/app/src/main/java/com/pineapple/sage/SageAutonomyStore.java
          grep -F 'Glass PASS' sage_build_1301_a/app/src/main/java/com/pineapple/sage/SageAutonomyActivity.java
          git rev-parse HEAD | tee Sage-1.30.1-source-commit.txt
          zip -qr Sage-Forge-0.3.1.zip sage_forge -x '*/__pycache__/*' '*.pyc'
          sha256sum Sage-Forge-0.3.1.zip | tee Sage-Forge-0.3.1.sha256

      - name: Upload final Sage 1.30.1 acceptance candidate
        uses: actions/upload-artifact@v4
        with:
          name: Sage-Commander-1.30.1-final
          path: |
            Sage-Commander-1.30.1-final.apk
            Sage-Commander-1.30.1-final.sha256
            Sage-Forge-0.3.1.zip
            Sage-Forge-0.3.1.sha256
            Sage-1.30.1-source-commit.txt
            sage-1301-apksigner.txt
            sage-1301-badging.txt
            sage-1301-wake-asset.txt
            sage-1301-native-brain.txt
          if-no-files-found: error
          retention-days: 30
