name: Verify Sage 1.33.2 physical acceptance repair

on:
  push:
    branches:
      - repair/physical-acceptance-v1-33-2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sage-1332:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Restore and verify preserved 1.32 to 1.33.2 source chain
        run: |
          set -euo pipefail
          test -s sage_recovery/v1_32_v1_33_2_sources.tar.xz.b64
          base64 --decode sage_recovery/v1_32_v1_33_2_sources.tar.xz.b64 > /tmp/sage-recovery.tar.xz
          echo '92ae23cc90f0da5c7aab16efe71c4d075b2dc28597a5bb519efa68510eb0fe17  /tmp/sage-recovery.tar.xz' | sha256sum -c -
          tar -xJf /tmp/sage-recovery.tar.xz
          python3 -m py_compile \
            sage_patches/owner_first_v1_32.py \
            sage_patches/release_v1_32.py \
            sage_patches/sageos_foundation_v1_33.py \
            sage_patches/release_v1_33.py \
            sage_tests/test_owner_first_v1_32.py \
            sage_tests/test_sageos_foundation_v1_33.py \
            sage_tests/test_physical_acceptance_v1_33_2.py
          test -x sage_tools/reconstruct_v1_32.sh || chmod +x sage_tools/reconstruct_v1_32.sh
          test -x sage_tools/reconstruct_v1_33.sh || chmod +x sage_tools/reconstruct_v1_33.sh
          test -x sage_tools/reconstruct_v1_33_2.sh || chmod +x sage_tools/reconstruct_v1_33_2.sh

      - name: Prove inherited final 1.31 floor
        run: |
          set -euo pipefail
          bash sage_tools/reconstruct_v1_31.sh sage_build_131_floor
          for test_file in sage_tests/test_*_v1_31.py; do
            echo "=== $test_file ==="
            python3 "$test_file" sage_build_131_floor
          done
          grep -F 'versionCode = 44' sage_build_131_floor/app/build.gradle.kts
          grep -F 'versionName = "1.31.0"' sage_build_131_floor/app/build.gradle.kts

      - name: Prove preserved 1.32 and 1.33 release lineage
        run: |
          set -euo pipefail
          bash sage_tools/reconstruct_v1_32.sh sage_build_132_floor
          python3 sage_tests/test_owner_first_v1_32.py sage_build_132_floor
          grep -F 'versionCode = 45' sage_build_132_floor/app/build.gradle.kts
          grep -F 'versionName = "1.32.0"' sage_build_132_floor/app/build.gradle.kts
          bash sage_tools/reconstruct_v1_33.sh sage_build_133_floor
          python3 sage_tests/test_sageos_foundation_v1_33.py sage_build_133_floor
          grep -F 'versionCode = 46' sage_build_133_floor/app/build.gradle.kts
          grep -F 'versionName = "1.33.0"' sage_build_133_floor/app/build.gradle.kts

      - name: Reconstruct Sage 1.33.2 twice and run repair gates
        run: |
          set -euo pipefail
          bash sage_tools/reconstruct_v1_33_2.sh sage_build_1332_a
          bash sage_tools/reconstruct_v1_33_2.sh sage_build_1332_b
          python3 sage_tests/test_physical_acceptance_v1_33_2.py sage_build_1332_a
          python3 sage_tests/test_physical_acceptance_v1_33_2.py sage_build_1332_b
          grep -F 'versionCode = 48' sage_build_1332_a/app/build.gradle.kts
          grep -F 'versionName = "1.33.2"' sage_build_1332_a/app/build.gradle.kts
          grep -F 'repair/physical-acceptance-v1-33-2' sage_build_1332_a/app/build.gradle.kts
          diff -qr --exclude=build --exclude=.gradle --exclude=.cxx sage_build_1332_a/app/src sage_build_1332_b/app/src
          cmp sage_build_1332_a/app/build.gradle.kts sage_build_1332_b/app/build.gradle.kts

      - name: Add exact pinned native Brain and Vosk wake model to both passes
        run: |
          set -euo pipefail
          mkdir -p sage_build_1332_a/third_party/llama.cpp
          git -C sage_build_1332_a/third_party/llama.cpp init
          git -C sage_build_1332_a/third_party/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C sage_build_1332_a/third_party/llama.cpp fetch --depth=1 origin d73c1d6b22a2d3ecc74c2c9cde354015ee72e862
          git -C sage_build_1332_a/third_party/llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C sage_build_1332_a/third_party/llama.cpp rev-parse HEAD)" = d73c1d6b22a2d3ecc74c2c9cde354015ee72e862
          mkdir -p /tmp/sage-vosk-1332 sage_build_1332_a/app/src/main/assets
          curl -L --fail --retry 3 --retry-delay 2 -o /tmp/sage-vosk-1332.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q /tmp/sage-vosk-1332.zip -d /tmp/sage-vosk-1332
          mv /tmp/sage-vosk-1332/vosk-model-small-en-us-0.15 sage_build_1332_a/app/src/main/assets/model-en-us
          printf 'sage-v1.33.2-physical-acceptance\n' > sage_build_1332_a/app/src/main/assets/model-en-us/uuid
          test -s sage_build_1332_a/app/src/main/assets/model-en-us/am/final.mdl
          mkdir -p sage_build_1332_b/third_party sage_build_1332_b/app/src/main/assets
          cp -a sage_build_1332_a/third_party/llama.cpp sage_build_1332_b/third_party/llama.cpp
          cp -a sage_build_1332_a/app/src/main/assets/model-en-us sage_build_1332_b/app/src/main/assets/model-en-us

      - name: Download and prove exact sherpa-onnx Android engine
        run: |
          set -euo pipefail
          AAR=/tmp/sherpa-onnx-1.13.4.aar
          URL=https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.4/sherpa-onnx-1.13.4.aar
          SHA=03f9c4df965f21c71269365a7951a7f23b5696fddd093fa318c80d65550ab780
          curl -L --fail --retry 3 --retry-delay 2 -o "$AAR" "$URL"
          test "$(stat -c%s "$AAR")" = 48847529
          echo "$SHA  $AAR" | sha256sum -c -
          unzip -l "$AAR" | grep -F 'jni/arm64-v8a/libonnxruntime.so'
          unzip -l "$AAR" | grep -F 'jni/arm64-v8a/libsherpa-onnx-jni.so'
          mkdir -p sage_build_1332_a/app/libs sage_build_1332_b/app/libs
          cp "$AAR" sage_build_1332_a/app/libs/sherpa-onnx-1.13.4.aar
          cp "$AAR" sage_build_1332_b/app/libs/sherpa-onnx-1.13.4.aar

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Verify permanent Sage signer
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode sage_signing/android-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          ACTUAL="$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)"
          EXPECTED=99e0a7c655cdefb3bb4ac85e5961d19358ee0ffdb3dce9b3a145f9cbcda78d35
          test "$ACTUAL" = "$EXPECTED"

      - name: Install exact Android toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;28.2.13676358"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Full first independent release gate
        working-directory: sage_build_1332_a
        env:
          SAGE_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf app/build .gradle app/.cxx
          gradle --no-daemon clean testReleaseUnitTest lintRelease assembleRelease --stacktrace

      - name: Full second independent release gate
        working-directory: sage_build_1332_b
        env:
          SAGE_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf app/build .gradle app/.cxx
          gradle --no-daemon clean testReleaseUnitTest lintRelease assembleRelease --stacktrace

      - name: Verify both APK identities, signatures, payloads and compact packaging
        run: |
          set -euo pipefail
          EXPECTED_SIGNER=99e0a7c655cdefb3bb4ac85e5961d19358ee0ffdb3dce9b3a145f9cbcda78d35
          verify_apk() {
            TREE="$1"
            TAG="$2"
            APK="$TREE/app/build/outputs/apk/release/app-release.apk"
            test -s "$APK"
            test "$(stat -c%s "$APK")" -lt 104857600
            unzip -t "$APK" >/dev/null
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$TAG-apksigner.txt"
            ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$TAG-apksigner.txt" | tr '[:upper:]' '[:lower:]')"
            test "$ACTUAL" = "$EXPECTED_SIGNER"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee "$TAG-badging.txt"
            grep -F "package: name='com.pineapple.sagecommander.stable'" "$TAG-badging.txt"
            grep -F "versionCode='48'" "$TAG-badging.txt"
            grep -F "versionName='1.33.2'" "$TAG-badging.txt"
            grep -F "application-label:'Sage Commander 1.33.2 · SageOS Repair'" "$TAG-badging.txt"
            unzip -Z1 "$APK" | grep -F 'assets/model-en-us/am/final.mdl'
            unzip -Z1 "$APK" | grep -F 'lib/arm64-v8a/libsage-brain.so'
            unzip -Z1 "$APK" | grep -F 'lib/arm64-v8a/libonnxruntime.so'
            unzip -Z1 "$APK" | grep -F 'lib/arm64-v8a/libsherpa-onnx-jni.so'
            test -z "$(unzip -Z1 "$APK" | grep '^lib/' | grep -v '^lib/arm64-v8a/' || true)"
            # Legacy packaging must compress native libraries so the APK remains below the delivery ceiling.
            python3 - "$APK" <<'PY'
import sys, zipfile
apk=sys.argv[1]
with zipfile.ZipFile(apk) as z:
    libs=[i for i in z.infolist() if i.filename.startswith('lib/') and i.filename.endswith('.so')]
    assert libs, 'no native libraries found'
    uncompressed=[i.filename for i in libs if i.compress_type == zipfile.ZIP_STORED]
    assert not uncompressed, 'uncompressed native libraries: ' + ', '.join(uncompressed)
PY
            sha256sum "$APK" | tee "$TAG.sha256"
          }
          verify_apk sage_build_1332_a sage-1332-a
          verify_apk sage_build_1332_b sage-1332-b

      - name: Compare unsigned APK payload content across independent builds
        run: |
          set -euo pipefail
          python3 - <<'PY'
from pathlib import Path
import hashlib, zipfile

def payload(path):
    out={}
    with zipfile.ZipFile(path) as z:
        for info in z.infolist():
            # Signing envelope lives outside normal entries; META-INF may vary too.
            if info.filename.startswith('META-INF/'):
                continue
            out[info.filename]=(hashlib.sha256(z.read(info.filename)).hexdigest(), info.compress_type)
    return out

a=payload(Path('sage_build_1332_a/app/build/outputs/apk/release/app-release.apk'))
b=payload(Path('sage_build_1332_b/app/build/outputs/apk/release/app-release.apk'))
assert a == b, 'independent APK payloads differ'
print(f'PASS - {len(a)} non-META-INF APK payload entries match byte-for-byte')
PY

      - name: Package verified Sage 1.33.2 delivery
        run: |
          set -euo pipefail
          APK=sage_build_1332_a/app/build/outputs/apk/release/app-release.apk
          cp "$APK" Sage-1.33.2.apk
          sha256sum Sage-1.33.2.apk > SHA256SUMS-Sage-1.33.2.txt
          printf '%s\n' '${{ github.sha }}' > Sage-1.33.2-source-commit.txt
          cat > Sage-1.33.2-PHYSICAL-TEST.txt <<'EOF'
Install Sage-1.33.2.apk IN PLACE. Do not uninstall Sage 1.33.1.
Physical acceptance targets:
1. Wake then speak 20 ordinary commands; no fake silent close.
2. Repeat with media playing.
3. Ask multiple local Brain questions, including one that takes over 30 seconds.
4. While Brain is thinking, say Sage; she should say "I'm thinking." without cancelling the answer.
5. Verify custom "sage glitch" still enters Red Queen.
6. Use typed chat; it must work independently of microphone permission and should remain text-only.
7. Verify Owner Apps, memories, Core, Forge pairing, accessibility and authority state remain intact.
8. Reboot and verify Sage background startup and wake behavior.
EOF

      - name: Upload Sage 1.33.2 physical acceptance candidate
        uses: actions/upload-artifact@v4
        with:
          name: Sage-1.33.2-physical-acceptance
          retention-days: 30
          path: |
            Sage-1.33.2.apk
            SHA256SUMS-Sage-1.33.2.txt
            Sage-1.33.2-source-commit.txt
            Sage-1.33.2-PHYSICAL-TEST.txt
            sage-1332-a-apksigner.txt
            sage-1332-a-badging.txt
            sage-1332-a.sha256
            sage-1332-b-apksigner.txt
            sage-1332-b-badging.txt
            sage-1332-b.sha256
