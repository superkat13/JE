name: Build and verify Sage 1.21 stabilization

on:
  workflow_dispatch:
  pull_request:
    branches:
      - sage-tablet-control-v1
  push:
    branches:
      - agent/sage-stabilization-v1-21

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct exact Sage 1.20 source
        run: |
          set -euo pipefail
          mkdir -p sage_build
          cat sage_package/part_*.b64 | tr -d '\n\r ' | base64 --decode > Sage_Tablet_Control_v1_source.zip
          echo "9d23d8566cd30a81818b99f7f032a823b89d98221da029b31c6d4838d5a07d91  Sage_Tablet_Control_v1_source.zip" | sha256sum --check
          unzip -q Sage_Tablet_Control_v1_source.zip -d sage_build
          patch --fuzz=0 -d sage_build -p1 < sage_patches/result_click_v1_1.patch
          patch --fuzz=0 -d sage_build -p1 < sage_patches/voice_redqueen_v1_2.patch
          patch --fuzz=0 -d sage_build -p1 < sage_patches/recognition_v1_4.patch
          base64 --decode sage_patches/natural_voice_v1_5.patch.gz.b64 | gunzip > /tmp/natural_voice_v1_5.patch
          patch --fuzz=0 -d sage_build -p1 < /tmp/natural_voice_v1_5.patch
          patch --fuzz=0 -d sage_build -p1 < sage_patches/updater_v1_6.patch
          base64 --decode sage_patches/wake_learn_click_v1_7.patch.gz.b64 | gunzip > /tmp/wake_learn_click_v1_7.patch
          echo "c5d5ee8681c03f393a77ff7da9b8afc0d6c2ff7f7d0d54ea4687e1144bab77dc  /tmp/wake_learn_click_v1_7.patch" | sha256sum --check
          patch --fuzz=0 -d sage_build -p1 < /tmp/wake_learn_click_v1_7.patch
          patch --fuzz=0 -d sage_build -p1 < sage_patches/native_speech_v1_9.patch
          patch --fuzz=0 -d sage_build -p1 < sage_patches/voice_accuracy_v1_10.patch
          patch --fuzz=0 -d sage_build -p1 < sage_patches/native_wake_teach_v1_11.patch
          patch --fuzz=0 -d sage_build -p1 < sage_patches/echo_guard_v1_12.patch
          patch --fuzz=0 -d sage_build -p1 < sage_patches/conversation_voice_v1_13.patch
          patch --fuzz=0 -d sage_build -p1 < sage_patches/translation_v1_14.patch
          patch --fuzz=0 -d sage_build -p1 < sage_patches/wake_learning_v1_15.patch
          patch --fuzz=0 -d sage_build -p1 < sage_patches/media_responses_v1_16.patch
          patch --fuzz=0 -d sage_build -p1 < sage_patches/screen_targeting_v1_17.patch
          patch --fuzz=0 -d sage_build -p1 < sage_patches/conversation_diagnostics_v1_18.patch
          patch --fuzz=0 -d sage_build -p1 < sage_patches/brain_v1_19.patch
          base64 --decode sage_patches/wake_match_v1_20.patch.gz.b64 | gunzip > /tmp/wake_match_v1_20.patch
          echo "7342e6ba2fc5a374b0ff77e222471912633e5f775a3ae92d5553a79a160a8547  /tmp/wake_match_v1_20.patch" | sha256sum --check
          patch --fuzz=0 -d sage_build -p1 < /tmp/wake_match_v1_20.patch

      - name: Apply Sage 1.21 stabilization
        run: |
          set -euo pipefail
          python3 -m py_compile sage_patches/stabilize_v1_21.py
          python3 sage_patches/stabilize_v1_21.py sage_build

      - name: Run behavior and source regression tests
        run: |
          set -euo pipefail
          python3 -m py_compile sage_tests/test_stabilization_v1_21.py
          python3 sage_tests/test_stabilization_v1_21.py sage_build

      - name: Add pinned llama.cpp engine
        run: |
          set -euo pipefail
          mkdir -p sage_build/third_party/llama.cpp
          git -C sage_build/third_party/llama.cpp init
          git -C sage_build/third_party/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C sage_build/third_party/llama.cpp fetch --depth=1 origin d73c1d6b22a2d3ecc74c2c9cde354015ee72e862
          git -C sage_build/third_party/llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C sage_build/third_party/llama.cpp rev-parse HEAD)" = "d73c1d6b22a2d3ecc74c2c9cde354015ee72e862"
          test -f sage_build/third_party/llama.cpp/include/llama.h

      - name: Add offline wake-word model
        run: |
          set -euo pipefail
          rm -rf sage_build/app/src/main/assets/model-en-us /tmp/vosk-model
          mkdir -p sage_build/app/src/main/assets /tmp/vosk-model
          curl -L --fail --retry 3 --retry-delay 2 \
            -o /tmp/vosk-model.zip \
            https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q /tmp/vosk-model.zip -d /tmp/vosk-model
          mv /tmp/vosk-model/vosk-model-small-en-us-0.15 sage_build/app/src/main/assets/model-en-us
          printf 'sage-v1.21-stabilization\n' > sage_build/app/src/main/assets/model-en-us/uuid
          test -f sage_build/app/src/main/assets/model-en-us/conf/model.conf

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install permanent Sage signing identity
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode sage_signing/android-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Install Android SDK 35 and native toolchain
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Compile Java and native code
        working-directory: sage_build
        run: gradle :app:compileDebugJavaWithJavac --stacktrace

      - name: Run Android unit-test task
        working-directory: sage_build
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run Android lint diagnostics
        id: android_lint
        continue-on-error: true
        working-directory: sage_build
        run: |
          set +e
          gradle :app:lintDebug --stacktrace 2>&1 | tee ../android-lint-console.txt
          status=${PIPESTATUS[0]}
          echo "$status" > ../android-lint-exit-code.txt
          find app/build/reports -maxdepth 2 -type f -print 2>/dev/null | sort | tee ../android-lint-report-files.txt
          exit "$status"

      - name: Upload Android lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sage-1.21-android-lint-diagnostics
          path: |
            android-lint-console.txt
            android-lint-exit-code.txt
            android-lint-report-files.txt
            sage_build/app/build/reports/lint-results-debug.*
          if-no-files-found: warn

      - name: Enforce Android lint gate
        if: steps.android_lint.outcome != 'success'
        run: |
          echo "Android lint failed. Verified APK release remains blocked."
          exit 1

      - name: Build signed permanent-update APK
        working-directory: sage_build
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK identity, certificate, alignment, native library, and contents
        run: |
          set -euo pipefail
          APK="sage_build/app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -f "$APK"
          unzip -t "$APK" | tee apk-zip-test.txt
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK" | tee apk-zipalign.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apk-signing.txt
          grep -qi "99e0a7c655cdefb3bb4ac85e5961d19358ee0ffdb3dce9b3a145f9cbcda78d35" apk-signing.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='com.pineapple.sagecommander.stable' versionCode='31' versionName='1.21'" apk-badging.txt
          unzip -l "$APK" | tee apk-file-list.txt
          grep -F "lib/arm64-v8a/libsage_brain.so" apk-file-list.txt
          unzip -p "$APK" classes.dex | strings > apk-dex-strings.txt
          grep -F "Numbers ready. Say the red number." apk-dex-strings.txt
          grep -F "com.pineapple.sagecommander.stable" apk-dex-strings.txt
          sha256sum "$APK" | tee apk-sha256.txt
          find sage_build/app/src/main -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | tee source-tree-sha256.txt
          cp "$APK" Sage-Commander-1.21-stabilization.apk

      - name: Upload verified Sage 1.21 APK and reports
        uses: actions/upload-artifact@v4
        with:
          name: Sage-Commander-1.21-stabilization-verified
          path: |
            Sage-Commander-1.21-stabilization.apk
            apk-zip-test.txt
            apk-zipalign.txt
            apk-signing.txt
            apk-badging.txt
            apk-file-list.txt
            apk-sha256.txt
            source-tree-sha256.txt
          if-no-files-found: error
