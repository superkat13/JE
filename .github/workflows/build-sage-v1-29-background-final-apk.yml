name: Build Sage 1.29 background-survival final APK

on:
  workflow_dispatch:
  push:
    branches:
      - sage-one-background-20260811

permissions:
  contents: read

jobs:
  build-verify-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and run complete current regressions
        run: |
          set -euo pipefail
          bash sage_tools/reconstruct_v1_29.sh sage_build_129
          for test_file in \
            sage_tests/test_brain_repair_v1_29.py \
            sage_tests/test_conversation_media_echo_v1_29.py \
            sage_tests/test_intent_semantic_actions_v1_29.py \
            sage_tests/test_confirmation_tone_v1_29.py \
            sage_tests/test_surprise_discovery_v1_29.py \
            sage_tests/test_brain_route_repair_v1_29.py \
            sage_tests/test_professional_brain_repair_v1_29.py \
            sage_tests/test_owner_home_categories_v1_29.py \
            sage_tests/test_media_voice_repair_v1_29.py \
            sage_tests/test_external_action_lifecycle_v1_29.py \
            sage_tests/test_surprise_fun_reliability_v1_29.py \
            sage_tests/test_monster_mode_v1_29.py \
            sage_tests/test_one_sage_routing_v1_29.py \
            sage_tests/test_easter_egg_personality_v1_29.py \
            sage_tests/test_voice_tolerance_v1_29.py \
            sage_tests/test_internal_specialist_routing_v1_29.py \
            sage_tests/test_owner_authority_cleanup_v1_29.py \
            sage_tests/test_red_queen_entry_v1_29.py \
            sage_tests/test_device_authority_v1_29.py \
            sage_tests/test_privilege_readiness_v1_29.py \
            sage_tests/test_dell_evidence_import_v1_29.py \
            sage_tests/test_capability_snapshot_v1_29.py \
            sage_tests/test_background_survival_v1_29.py; do
            python3 "$test_file" sage_build_129
          done
          python3 -m py_compile sage_patches/*.py sage_tests/*.py
          python3 -m unittest -v sage_forge.tests.test_forge

          bash sage_tools/reconstruct_v1_28.sh sage_build_128
          for test_file in \
            sage_tests/test_stabilization_v1_21.py \
            sage_tests/test_android_compat_v1_21.py \
            sage_tests/test_brain_watchdog_v1_22.py \
            sage_tests/test_wake_profiles_and_recognition_v1_23.py \
            sage_tests/test_wake_profiles_compile_repair_v1_23.py \
            sage_tests/test_continuity_report_v1_24.py \
            sage_tests/test_number_overlay_release_v1_24_1.py \
            sage_tests/test_sage_release_v1_24_2.py \
            sage_tests/test_self_repair_v1_25.py \
            sage_tests/test_workbench_v1_25.py \
            sage_tests/test_sage_forge_v1_25.py \
            sage_tests/test_reliability_toolbelt_v1_26.py \
            sage_tests/test_continuity_finish_v1_26.py \
            sage_tests/test_intelligence_memory_v1_27.py \
            sage_tests/test_living_sage_v1_28.py \
            sage_tests/test_red_queen_v1_28.py \
            sage_tests/test_orchestrator_registry_v1_28.py \
            sage_tests/test_package_file_labs_v1_28.py \
            sage_tests/test_network_operations_v1_28.py \
            sage_tests/test_automation_v1_28.py; do
            python3 "$test_file" sage_build_128
          done
          python3 sage_tests/test_public_disclosure_v1_27.py

          bash sage_tools/reconstruct_v1_29.sh sage_build_129_second
          diff -qr --exclude=build --exclude=.gradle sage_build_129/app/src sage_build_129_second/app/src
          cmp sage_build_129/app/build.gradle.kts sage_build_129_second/app/build.gradle.kts
          python3 sage_tests/test_background_survival_v1_29.py sage_build_129_second

      - name: Add pinned native Brain and offline wake model
        run: |
          set -euo pipefail
          mkdir -p sage_build_129/third_party/llama.cpp
          git -C sage_build_129/third_party/llama.cpp init
          git -C sage_build_129/third_party/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C sage_build_129/third_party/llama.cpp fetch --depth=1 origin d73c1d6b22a2d3ecc74c2c9cde354015ee72e862
          git -C sage_build_129/third_party/llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C sage_build_129/third_party/llama.cpp rev-parse HEAD)" = d73c1d6b22a2d3ecc74c2c9cde354015ee72e862
          mkdir -p /tmp/sage-vosk-129 sage_build_129/app/src/main/assets
          curl -L --fail --retry 3 --retry-delay 2 -o /tmp/sage-vosk-129.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q /tmp/sage-vosk-129.zip -d /tmp/sage-vosk-129
          mv /tmp/sage-vosk-129/vosk-model-small-en-us-0.15 sage_build_129/app/src/main/assets/model-en-us
          printf 'sage-v1.29.0-background-survival\n' > sage_build_129/app/src/main/assets/model-en-us/uuid
          test -s sage_build_129/app/src/main/assets/model-en-us/am/final.mdl

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Android toolchain and permanent signer
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;28.2.13676358"
          mkdir -p "$HOME/.android"
          base64 --decode sage_signing/android-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          ACTUAL="$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)"
          test "$ACTUAL" = "99e0a7c655cdefb3bb4ac85e5961d19358ee0ffdb3dce9b3a145f9cbcda78d35"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Compile, test, lint, and assemble release
        working-directory: sage_build_129
        run: |
          set -euo pipefail
          gradle :app:compileReleaseJavaWithJavac --stacktrace
          gradle :app:externalNativeBuildRelease --stacktrace
          gradle :app:testReleaseUnitTest --stacktrace
          gradle :app:lintRelease --stacktrace
          gradle :app:assembleRelease --stacktrace

      - name: Verify final APK
        run: |
          set -euo pipefail
          APK=Sage-Commander-1.29.0-background-survival-verified.apk
          cp sage_build_129/app/build/outputs/apk/release/app-release.apk "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee APKSIGNER_FULL.txt
          ACTUAL_CERT_SHA="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' APKSIGNER_FULL.txt | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_CERT_SHA" = "99e0a7c655cdefb3bb4ac85e5961d19358ee0ffdb3dce9b3a145f9cbcda78d35"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK" | tee ZIPALIGN_FULL.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee PACKAGE_BADGING.txt
          grep -F "package: name='com.pineapple.sagecommander.stable' versionCode='41' versionName='1.29.0'" PACKAGE_BADGING.txt
          sha256sum "$APK" | tee APK_SHA256.txt
          unzip -t "$APK" | tee ZIP_INTEGRITY.txt
          grep -F 'No errors detected in compressed data' ZIP_INTEGRITY.txt
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libsage-brain.so'

      - name: Write tablet acceptance checklist
        run: |
          cat > BACKGROUND_PHYSICAL_ACCEPTANCE.md <<'EOF'
          # Sage 1.29 background-survival physical acceptance

          Install over the existing `com.pineapple.sagecommander.stable` app. Do not uninstall first.

          Required tablet checks:
          1. Existing memories, wake profiles, Red Queen settings, Brain model selection, and Forge pairing remain present.
          2. Start Sage listening, press Home, open another app, and leave Sage backgrounded for at least 10 minutes.
          3. Say the saved wake phrase while another app is foreground. Sage must hear it and accept a command.
          4. Turn the screen off for several minutes, wake the tablet, then test the wake phrase again.
          5. Swipe Sage away from Recents while listening is enabled. The foreground voice service must remain active and recover wake listening.
          6. Explicitly press Stop in Sage. The background service and wake lock must stop cleanly.
          7. Verify the persistent foreground-service notification remains present while background listening is active.
          8. Capture a new Sage diagnostic report after the background tests.

          Static CI cannot prove OEM battery-manager behavior on the physical VASOUN tablet. Physical acceptance is required before background survival is considered complete.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: Sage-Commander-1.29.0-background-survival-verified
          if-no-files-found: error
          retention-days: 30
          path: |
            Sage-Commander-1.29.0-background-survival-verified.apk
            APK_SHA256.txt
            APKSIGNER_FULL.txt
            ZIPALIGN_FULL.txt
            PACKAGE_BADGING.txt
            ZIP_INTEGRITY.txt
            BACKGROUND_PHYSICAL_ACCEPTANCE.md
