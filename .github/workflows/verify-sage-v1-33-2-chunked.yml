name: Verify Sage 1.33.2 chunked recovery

on:
  push:
    branches:
      - repair/physical-acceptance-v1-33-2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Restore preserved source chain from verified chunks
        shell: bash
        run: |
          set -euo pipefail
          test "$(find sage_recovery/chunks -maxdepth 1 -name 'part-*.b64' | wc -l)" -eq 7
          cat sage_recovery/chunks/part-*.b64 | tr -d '\r\n ' | base64 --decode > /tmp/sage-recovery.tar.xz
          echo '92ae23cc90f0da5c7aab16efe71c4d075b2dc28597a5bb519efa68510eb0fe17  /tmp/sage-recovery.tar.xz' | sha256sum -c -
          tar -xJf /tmp/sage-recovery.tar.xz
          base64 --decode sage_recovery/sherpa_primary_v1_31.py.xz.b64 > /tmp/sherpa_primary_v1_31.py.xz
          echo '19cfef2113c696bb7c3db1f98ff0bd8e2e7faa8c1ee65b0776532c1bbb8599b7  /tmp/sherpa_primary_v1_31.py.xz' | sha256sum -c -
          xz -dc /tmp/sherpa_primary_v1_31.py.xz > sage_patches/sherpa_primary_v1_31.py
          echo '7eee79ffb09a30eb65c9a8187475fa07bfbf392a28aadcbf64d6b03d8b4999a4  sage_patches/sherpa_primary_v1_31.py' | sha256sum -c -
          python3 -m py_compile sage_patches/sherpa_primary_v1_31.py sage_patches/owner_first_v1_32.py sage_patches/release_v1_32.py sage_patches/sageos_foundation_v1_33.py sage_patches/release_v1_33.py sage_tests/test_owner_first_v1_32.py sage_tests/test_sageos_foundation_v1_33.py sage_tests/test_physical_acceptance_v1_33_2.py
          chmod +x sage_tools/reconstruct_v1_32.sh sage_tools/reconstruct_v1_33.sh sage_tools/reconstruct_v1_33_2.sh

      - name: Prove inherited 1.31 floor and preserved 1.32/1.33 lineage
        shell: bash
        run: |
          set -euo pipefail
          bash sage_tools/reconstruct_v1_31.sh sage_build_131_floor
          for test_file in sage_tests/test_*_v1_31.py; do python3 "$test_file" sage_build_131_floor; done
          grep -F 'versionCode = 44' sage_build_131_floor/app/build.gradle.kts
          grep -F 'versionName = "1.31.0"' sage_build_131_floor/app/build.gradle.kts
          bash sage_tools/reconstruct_v1_32.sh sage_build_132_floor
          python3 sage_tests/test_owner_first_v1_32.py sage_build_132_floor
          grep -F 'versionCode = 45' sage_build_132_floor/app/build.gradle.kts
          grep -F 'versionName = "1.32.0"' sage_build_132_floor/app/build.gradle.kts
          bash sage_tools/reconstruct_v1_33.sh sage_build_133_floor
          python3 sage_tests/test_sageos_foundation_v1_33.py sage_build_133_floor
          grep -F 'versionCode = 46' sage_build_133_floor/app/build.gradle.kts
          grep -F 'versionName = "1.33.0"' sage_build_133_floor/app/build.gradle.kts

      - name: Reconstruct 1.33.2 twice and run physical acceptance static gate
        shell: bash
        run: |
          set -euo pipefail
          bash sage_tools/reconstruct_v1_33_2.sh sage_build_1332_a
          bash sage_tools/reconstruct_v1_33_2.sh sage_build_1332_b
          patch -d sage_build_1332_a -p1 --forward --batch < sage_recovery/compile_fix_v1_33_2.patch
          patch -d sage_build_1332_b -p1 --forward --batch < sage_recovery/compile_fix_v1_33_2.patch
          grep -F 'import android.Manifest;' sage_build_1332_a/app/src/main/java/com/pineapple/sage/SageVoiceService.java
          grep -F 'import android.content.pm.PackageManager;' sage_build_1332_a/app/src/main/java/com/pineapple/sage/SageVoiceService.java
          grep -F 'import android.Manifest;' sage_build_1332_b/app/src/main/java/com/pineapple/sage/SageVoiceService.java
          grep -F 'import android.content.pm.PackageManager;' sage_build_1332_b/app/src/main/java/com/pineapple/sage/SageVoiceService.java
          python3 sage_tests/test_physical_acceptance_v1_33_2.py sage_build_1332_a
          python3 sage_tests/test_physical_acceptance_v1_33_2.py sage_build_1332_b
          grep -F 'versionCode = 48' sage_build_1332_a/app/build.gradle.kts
          grep -F 'versionName = "1.33.2"' sage_build_1332_a/app/build.gradle.kts
          grep -F 'repair/physical-acceptance-v1-33-2' sage_build_1332_a/app/build.gradle.kts
          diff -qr --exclude=build --exclude=.gradle --exclude=.cxx sage_build_1332_a/app/src sage_build_1332_b/app/src
          cmp sage_build_1332_a/app/build.gradle.kts sage_build_1332_b/app/build.gradle.kts

      - name: Add exact pinned Brain, wake model and Sherpa engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sage_build_1332_a/third_party/llama.cpp
          git -C sage_build_1332_a/third_party/llama.cpp init -q
          git -C sage_build_1332_a/third_party/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C sage_build_1332_a/third_party/llama.cpp fetch -q --depth=1 origin d73c1d6b22a2d3ecc74c2c9cde354015ee72e862
          git -C sage_build_1332_a/third_party/llama.cpp checkout -q --detach FETCH_HEAD
          test "$(git -C sage_build_1332_a/third_party/llama.cpp rev-parse HEAD)" = d73c1d6b22a2d3ecc74c2c9cde354015ee72e862
          mkdir -p /tmp/vosk sage_build_1332_a/app/src/main/assets
          curl -L --fail --retry 3 -o /tmp/vosk.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q /tmp/vosk.zip -d /tmp/vosk
          mv /tmp/vosk/vosk-model-small-en-us-0.15 sage_build_1332_a/app/src/main/assets/model-en-us
          printf 'sage-v1.33.2-physical-acceptance\n' > sage_build_1332_a/app/src/main/assets/model-en-us/uuid
          test -s sage_build_1332_a/app/src/main/assets/model-en-us/am/final.mdl
          AAR=/tmp/sherpa-onnx-1.13.4.aar
          curl -L --fail --retry 3 -o "$AAR" https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.4/sherpa-onnx-1.13.4.aar
          echo '03f9c4df965f21c71269365a7951a7f23b5696fddd093fa318c80d65550ab780  /tmp/sherpa-onnx-1.13.4.aar' | sha256sum -c -
          unzip -l "$AAR" | grep -F 'jni/arm64-v8a/libonnxruntime.so'
          unzip -l "$AAR" | grep -F 'jni/arm64-v8a/libsherpa-onnx-jni.so'
          mkdir -p sage_build_1332_a/app/libs sage_build_1332_b/app/libs sage_build_1332_b/third_party sage_build_1332_b/app/src/main/assets
          cp "$AAR" sage_build_1332_a/app/libs/sherpa-onnx-1.13.4.aar
          cp "$AAR" sage_build_1332_b/app/libs/sherpa-onnx-1.13.4.aar
          cp -a sage_build_1332_a/third_party/llama.cpp sage_build_1332_b/third_party/llama.cpp
          cp -a sage_build_1332_a/app/src/main/assets/model-en-us sage_build_1332_b/app/src/main/assets/model-en-us

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install exact Android toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Restore and verify permanent Sage signer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode sage_signing/android-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          ACTUAL="$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)"
          test "$ACTUAL" = 99e0a7c655cdefb3bb4ac85e5961d19358ee0ffdb3dce9b3a145f9cbcda78d35

      - name: Full independent release build A
        working-directory: sage_build_1332_a
        env:
          SAGE_SOURCE_COMMIT: ${{ github.sha }}
        run: gradle --no-daemon clean testReleaseUnitTest lintRelease assembleRelease --stacktrace

      - name: Full independent release build B
        working-directory: sage_build_1332_b
        env:
          SAGE_SOURCE_COMMIT: ${{ github.sha }}
        run: gradle --no-daemon clean testReleaseUnitTest lintRelease assembleRelease --stacktrace

      - name: Verify both APKs and compare payloads
        shell: bash
        run: |
          set -uo pipefail
          exec > >(tee verification-result.txt) 2>&1
          failures=0
          pass() { printf 'PASS:%s\n' "$1"; }
          fail() { printf 'FAIL:%s\n' "$1"; failures=$((failures + 1)); }
          check() {
            local name="$1"
            shift
            printf 'CHECK:%s\n' "$name"
            if "$@"; then pass "$name"; else fail "$name"; fi
          }
          verify_apk() {
            local TREE="$1" TAG="$2" APK="$1/app/build/outputs/apk/release/app-release.apk"
            printf '=== VERIFY:%s:%s ===\n' "$TAG" "$APK"
            check "$TAG:apk-present" test -s "$APK"
            if [[ -e "$APK" ]]; then
              local bytes
              bytes="$(stat -c%s "$APK" 2>/dev/null || echo 0)"
              printf 'APK_SIZE:%s:%s\n' "$TAG" "$bytes"
              if [[ "$bytes" =~ ^[0-9]+$ ]] && (( bytes < 104857600 )); then pass "$TAG:apk-under-100MiB"; else fail "$TAG:apk-under-100MiB"; fi
              check "$TAG:zip-integrity" unzip -t "$APK"
            else
              fail "$TAG:apk-under-100MiB"
              fail "$TAG:zip-integrity"
              return
            fi
            printf 'CHECK:%s:signature-valid\n' "$TAG"
            if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" 2>&1 | tee "$TAG-apksigner.txt"; then pass "$TAG:signature-valid"; else fail "$TAG:signature-valid"; fi
            if grep -Fiq 'Signer #1 certificate SHA-256 digest: 99e0a7c655cdefb3bb4ac85e5961d19358ee0ffdb3dce9b3a145f9cbcda78d35' "$TAG-apksigner.txt"; then pass "$TAG:signer-sha256"; else fail "$TAG:signer-sha256"; fi
            printf 'CHECK:%s:aapt-badging\n' "$TAG"
            if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" 2>&1 | tee "$TAG-badging.txt"; then pass "$TAG:aapt-badging"; else fail "$TAG:aapt-badging"; fi
            if grep -Fq "package: name='com.pineapple.sagecommander.stable'" "$TAG-badging.txt"; then pass "$TAG:package-name"; else fail "$TAG:package-name"; fi
            if grep -Fq "versionCode='48'" "$TAG-badging.txt"; then pass "$TAG:version-code"; else fail "$TAG:version-code"; fi
            if grep -Fq "versionName='1.33.2'" "$TAG-badging.txt"; then pass "$TAG:version-name"; else fail "$TAG:version-name"; fi
            if grep -Fq "application-label:'Sage Commander 1.33.2 · SageOS Repair'" "$TAG-badging.txt"; then pass "$TAG:application-label"; else fail "$TAG:application-label"; fi
            unzip -Z1 "$APK" > "$TAG-entries.txt"
            if grep -Fxq 'assets/model-en-us/am/final.mdl' "$TAG-entries.txt"; then pass "$TAG:vosk-model"; else fail "$TAG:vosk-model"; fi
            if grep -Fxq 'lib/arm64-v8a/libsage-brain.so' "$TAG-entries.txt"; then pass "$TAG:brain-native"; else fail "$TAG:brain-native"; fi
            if grep -Fxq 'lib/arm64-v8a/libonnxruntime.so' "$TAG-entries.txt"; then pass "$TAG:onnx-native"; else fail "$TAG:onnx-native"; fi
            if grep -Fxq 'lib/arm64-v8a/libsherpa-onnx-jni.so' "$TAG-entries.txt"; then pass "$TAG:sherpa-native"; else fail "$TAG:sherpa-native"; fi
            if ! grep '^lib/' "$TAG-entries.txt" | grep -v '^lib/arm64-v8a/' > "$TAG-unexpected-abis.txt"; then pass "$TAG:arm64-only"; else cat "$TAG-unexpected-abis.txt"; fail "$TAG:arm64-only"; fi
            printf 'CHECK:%s:native-libs-compressed\n' "$TAG"
            if python3 -c 'import sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); libs=[i for i in z.infolist() if i.filename.startswith("lib/") and i.filename.endswith(".so")]; [print(f"LIB_META:{i.filename}:compress_type={i.compress_type}:size={i.file_size}:compressed={i.compress_size}") for i in libs]; ok=bool(libs) and all(i.compress_type != zipfile.ZIP_STORED for i in libs); print(f"NATIVE_LIB_COUNT={len(libs)}"); print(f"NATIVE_LIBS_COMPRESSED={ok}"); sys.exit(0 if ok else 1)' "$APK"; then pass "$TAG:native-libs-compressed"; else fail "$TAG:native-libs-compressed"; fi
            sha256sum "$APK" | tee "$TAG.sha256"
          }
          verify_apk sage_build_1332_a sage-1332-a
          verify_apk sage_build_1332_b sage-1332-b
          printf 'CHECK:payload-match\n'
          rm -rf /tmp/apk-a /tmp/apk-b
          mkdir -p /tmp/apk-a /tmp/apk-b
          unzip -q sage_build_1332_a/app/build/outputs/apk/release/app-release.apk -d /tmp/apk-a
          unzip -q sage_build_1332_b/app/build/outputs/apk/release/app-release.apk -d /tmp/apk-b
          rm -rf /tmp/apk-a/META-INF /tmp/apk-b/META-INF
          if diff -qr /tmp/apk-a /tmp/apk-b | tee payload-diff.txt; then pass 'payload-match'; else fail 'payload-match'; fi
          printf 'VERIFIER_FAILURE_COUNT=%s\n' "$failures"
          if (( failures != 0 )); then printf 'VERIFIER_RESULT=FAIL\n'; exit 1; fi
          printf 'VERIFIER_RESULT=PASS\n'

      - name: Upload verifier diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Sage-1.33.2-verifier-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: |
            verification-result.txt
            payload-diff.txt
            sage-1332-a-apksigner.txt
            sage-1332-a-badging.txt
            sage-1332-a-entries.txt
            sage-1332-a-unexpected-abis.txt
            sage-1332-a.sha256
            sage-1332-b-apksigner.txt
            sage-1332-b-badging.txt
            sage-1332-b-entries.txt
            sage-1332-b-unexpected-abis.txt
            sage-1332-b.sha256

      - name: Package verified candidate
        shell: bash
        run: |
          set -euo pipefail
          cp sage_build_1332_a/app/build/outputs/apk/release/app-release.apk Sage-1.33.2.apk
          sha256sum Sage-1.33.2.apk > SHA256SUMS-Sage-1.33.2.txt
          printf '%s\n' '${{ github.sha }}' > Sage-1.33.2-source-commit.txt
          printf '%s\n' 'Install IN PLACE over 1.33.1. Do not uninstall.' 'Physical tests: typed chat without mic; 20 wake-command turns; media-playing turns; Brain over 30s; repeated Sage says I am thinking without cancellation; sage glitch; reboot/data continuity.' > Sage-1.33.2-PHYSICAL-TEST.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Sage-1.33.2-physical-acceptance
          retention-days: 30
          path: |
            Sage-1.33.2.apk
            SHA256SUMS-Sage-1.33.2.txt
            Sage-1.33.2-source-commit.txt
            Sage-1.33.2-PHYSICAL-TEST.txt
            sage-1332-a-apksigner.txt
            sage-1332-a-badging.txt
            sage-1332-a.sha256
            sage-1332-b-apksigner.txt
            sage-1332-b-badging.txt
            sage-1332-b.sha256
