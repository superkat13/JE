name: Verify SageOS 2

on:
  push:
    branches: [sageos-2]
    paths:
      - 'sageos2/**'
      - 'SAGEOS2_MASTER_PLAN.md'
      - '.github/workflows/verify-sageos2.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Verify authority and assistant component contract
        run: |
          set -euo pipefail
          manifest=sageos2/app/src/main/AndroidManifest.xml
          for component in \
            com.pineapple.sage.MainActivity \
            com.pineapple.sage.SageAccessibilityService \
            com.pineapple.sage.SageNotificationListener \
            com.pineapple.sage.SageVoiceService \
            com.pineapple.sage.SageDeviceAdminReceiver \
            com.pineapple.sage.SageBootReceiver \
            com.pineapple.sage.SageAssistActivity \
            com.pineapple.sage.SageVoiceInteractionService \
            com.pineapple.sage.SageVoiceInteractionSessionService \
            com.pineapple.sage.SageSherpaRecognitionService; do
            grep -F "android:name=\"$component\"" "$manifest"
          done
          grep -F 'android:name="android.voice_interaction"' "$manifest"
          grep -F 'android:name="android.service.voice.VoiceInteractionService"' "$manifest"
          grep -F 'android:sessionService="com.pineapple.sage.SageVoiceInteractionSessionService"' sageos2/app/src/main/res/xml/sage_voice_interaction.xml
          grep -F 'android:recognitionService="com.pineapple.sage.SageSherpaRecognitionService"' sageos2/app/src/main/res/xml/sage_voice_interaction.xml
      - name: Verify core and build debug APK
        run: gradle -p sageos2 testDebugUnitTest assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sageos2-debug
          path: sageos2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
