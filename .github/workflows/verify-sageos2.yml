name: Verify SageOS 2

on:
  push:
    branches: [sageos-2]
    paths: ['sageos2/**','SAGEOS2_MASTER_PLAN.md','SAGEOS2_CONTINUITY.md','SAGEOS2_ROOT_BROKER.md','.github/workflows/verify-sageos2.yml']
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.3.1' }
      - name: Reject removed Shizuku architecture
        run: |
          set -euo pipefail
          if grep -Rni --exclude='SAGEOS2_MASTER_PLAN.md' --exclude='SAGEOS2_CONTINUITY.md' --exclude='verify-sageos2.yml' 'shizuku' sageos2; then exit 1; fi
          ! grep -qi 'shizuku' sageos2/app/src/main/AndroidManifest.xml
      - name: Verify Brain architecture and provenance
        run: |
          grep -F 'class BrainRouterEngine' sageos2/app/src/main/java/com/pineapple/sageos2/brain/BrainRouterEngine.kt
          grep -F 'class LocalNativeBrainEngine' sageos2/app/src/main/java/com/pineapple/sageos2/brain/LocalNativeBrainEngine.kt
          grep -F 'class SageBrainManager' sageos2/app/src/main/java/com/pineapple/sage/SageBrainManager.kt
          grep -F 'PROVIDER_LIMITATION' sageos2/app/src/main/java/com/pineapple/sageos2/brain/BrainFailure.kt
      - name: Verify continuity and diagnostics
        run: |
          grep -F 'data class TaskCheckpoint' sageos2/app/src/main/java/com/pineapple/sageos2/continuity/TaskContinuity.kt
          grep -F 'class SharedPreferencesTraceStore' sageos2/app/src/main/java/com/pineapple/sageos2/diagnostics/SharedPreferencesTraceStore.kt
          grep -F 'class PersistentRuntimeObserver' sageos2/app/src/main/java/com/pineapple/sageos2/runtime/PersistentRuntimeObserver.kt
      - name: Verify twin context and Owner Apps
        run: |
          grep -F 'class TwinContextRenderer' sageos2/app/src/main/java/com/pineapple/sageos2/identity/TwinContextRenderer.kt
          grep -F 'data class OwnerAppRecord' sageos2/app/src/main/java/com/pineapple/sageos2/apps/OwnerApps.kt
      - name: Verify wake, memory and history
        run: |
          grep -F 'data class WakeProfile' sageos2/app/src/main/java/com/pineapple/sageos2/speech/WakeProfiles.kt
          grep -F 'data class TwinMemoryRecord' sageos2/app/src/main/java/com/pineapple/sageos2/memory/TwinMemory.kt
          grep -F 'data class ConversationEntry' sageos2/app/src/main/java/com/pineapple/sageos2/memory/ConversationHistory.kt
      - name: Verify Sage owns behavioral policy and root path
        run: |
          grep -F 'val selfRestrictions: List<String>' sageos2/app/src/main/java/com/pineapple/sageos2/identity/SageCore.kt
          grep -F 'data class ExecuteProcess' sageos2/app/src/main/java/com/pineapple/sageos2/root/RootBroker.kt
          grep -F 'interface RootBrokerClient' sageos2/app/src/main/java/com/pineapple/sageos2/root/RootBroker.kt
      - name: Verify deterministic actions and speech
        run: |
          grep -F 'class AndroidFastActionEngine' sageos2/app/src/main/java/com/pineapple/sageos2/action/AndroidFastActionEngine.kt
          grep -F 'class AndroidSpeechPort' sageos2/app/src/main/java/com/pineapple/sageos2/speech/AndroidSpeechPort.kt
      - name: Verify authority component contract
        run: |
          manifest=sageos2/app/src/main/AndroidManifest.xml
          for component in com.pineapple.sage.MainActivity com.pineapple.sage.SageAccessibilityService com.pineapple.sage.SageNotificationListener com.pineapple.sage.SageVoiceService com.pineapple.sage.SageDeviceAdminReceiver com.pineapple.sage.SageBootReceiver com.pineapple.sage.SageAssistActivity com.pineapple.sage.SageVoiceInteractionService com.pineapple.sage.SageVoiceInteractionSessionService com.pineapple.sage.SageSherpaRecognitionService; do grep -F "android:name=\"$component\"" "$manifest"; done
      - name: Verify core and build debug APK
        run: gradle -p sageos2 testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: sageos2-debug, path: sageos2/app/build/outputs/apk/debug/app-debug.apk, if-no-files-found: error }
