name: Verify SageOS 2

on:
  push:
    branches: [sageos-2]
    paths: ['sageos2/**','SAGEOS2_MASTER_PLAN.md','SAGEOS2_CONTINUITY.md','SAGEOS2_ROOT_BROKER.md','.github/workflows/verify-sageos2.yml']
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.3.1' }
      - uses: actions/cache@v4
        with:
          path: |
            sageos2/.deps/kws
            sageos2/app/libs/sherpa-onnx-1.13.7.aar
            sageos2/app/src/main/assets/sherpa-kws
          key: sageos2-kws-v1-1.13.7-2e6ac2577310bfa2
      - name: Reject removed Shizuku architecture
        run: |
          set -euo pipefail
          if grep -Rni --exclude='SAGEOS2_MASTER_PLAN.md' --exclude='SAGEOS2_CONTINUITY.md' --exclude='verify-sageos2.yml' 'shizuku' sageos2; then exit 1; fi
          ! grep -qi 'shizuku' sageos2/app/src/main/AndroidManifest.xml
      - name: Verify root broker trust boundary and host syntax
        run: |
          set -euo pipefail
          g++ -std=c++20 -D_GNU_SOURCE -Wall -Wextra -Werror -Wno-missing-field-initializers -fsyntax-only sageos2/system/rootd/sage_rootd.cpp
          grep -F 'SO_PEERCRED' sageos2/system/rootd/sage_rootd.cpp
          grep -F 'SO_PEERSEC' sageos2/system/rootd/sage_rootd.cpp
          grep -F 'kAllowedPeerPrefix = "u:r:sage_app:s0"' sageos2/system/rootd/sage_rootd.cpp
          grep -F 'socket sage_rootd stream 0666 root root' sageos2/system/rootd/sage_rootd.rc
          grep -F 'seinfo=platform name=com.pineapple.sagecommander.stable domain=sage_app' sageos2/system/sepolicy/private/seapp_contexts
          grep -F 'allow sage_app sage_rootd:unix_stream_socket connectto;' sageos2/system/sepolicy/private/sage_app.te
          grep -F 'class SocketRootBrokerClient' sageos2/app/src/main/java/com/pineapple/sageos2/root/SocketRootBrokerClient.kt
          grep -F 'class AndroidCapabilityBroker' sageos2/app/src/main/java/com/pineapple/sageos2/capability/AndroidCapabilityBroker.kt
          grep -F '"root.install_package"' sageos2/app/src/main/java/com/pineapple/sageos2/capability/AndroidCapabilityBroker.kt
          grep -F 'val capabilities = AndroidCapabilityBroker' sageos2/app/src/main/java/com/pineapple/sageos2/runtime/SageRuntimeHost.kt
          test ! -e sageos2/app/src/main/java/com/pineapple/sageos2/authority/AuthorityBroker.kt
          ! grep -Rni 'permissive sage_rootd' sageos2/system
          ! grep -Rni 'sh -c' sageos2/system/rootd
      - name: Prepare pinned offline wake dependencies
        run: |
          set -euo pipefail
          bash sageos2/tools/fetch-kws-deps.sh
          test -s sageos2/app/libs/sherpa-onnx-1.13.7.aar
          test -s sageos2/app/src/main/assets/sherpa-kws/encoder.int8.onnx
          test -s sageos2/app/src/main/assets/sherpa-kws/decoder.onnx
          test -s sageos2/app/src/main/assets/sherpa-kws/joiner.int8.onnx
          test -s sageos2/app/src/main/assets/sherpa-kws/tokens.txt
      - name: Prepare exact pinned llama.cpp for native Brain
        run: |
          set -euo pipefail
          PIN=d73c1d6b22a2d3ecc74c2c9cde354015ee72e862
          DIR=sageos2/third_party/llama.cpp
          rm -rf "$DIR"
          mkdir -p "$(dirname "$DIR")"
          git clone --filter=blob:none --no-checkout https://github.com/ggerganov/llama.cpp.git "$DIR"
          git -C "$DIR" fetch --depth=1 origin "$PIN"
          git -C "$DIR" checkout --detach "$PIN"
          test "$(git -C "$DIR" rev-parse HEAD)" = "$PIN"
          git -C "$DIR" diff-index --quiet HEAD -- .
      - name: Verify Brain architecture and exact donor JNI boundary
        run: |
          grep -F 'class BrainRouterEngine' sageos2/app/src/main/java/com/pineapple/sageos2/brain/BrainRouterEngine.kt
          grep -F 'class LocalNativeBrainEngine' sageos2/app/src/main/java/com/pineapple/sageos2/brain/LocalNativeBrainEngine.kt
          grep -F 'interface NativeBrainBridge' sageos2/app/src/main/java/com/pineapple/sageos2/brain/NativeBrainBridge.kt
          grep -F 'systemPrompt = systemPrompt' sageos2/app/src/main/java/com/pineapple/sageos2/brain/LocalNativeBrainEngine.kt
          grep -F 'userPrompt = userPrompt' sageos2/app/src/main/java/com/pineapple/sageos2/brain/LocalNativeBrainEngine.kt
          grep -F 'SAGE_LLAMA_PIN "d73c1d6b22a2d3ecc74c2c9cde354015ee72e862"' sageos2/app/src/main/cpp/CMakeLists.txt
          grep -F 'PROVIDER_LIMITATION' sageos2/app/src/main/java/com/pineapple/sageos2/brain/BrainFailure.kt
      - name: Verify structured tools Forge and safe recovery
        run: |
          set -euo pipefail
          grep -F 'object BrainToolDirectiveParser' sageos2/app/src/main/java/com/pineapple/sageos2/brain/BrainToolDirective.kt
          grep -F 'maxToolCallsPerTurn: Int = 4' sageos2/app/src/main/java/com/pineapple/sageos2/runtime/SageRuntime.kt
          grep -F 'capabilityExecutor = Executors.newSingleThreadExecutor' sageos2/app/src/main/java/com/pineapple/sageos2/runtime/SageRuntime.kt
          grep -F 'Capability.FORGE' sageos2/app/src/main/java/com/pineapple/sageos2/brain/BrainToolContext.kt
          grep -F 'approved = false' sageos2/app/src/main/java/com/pineapple/sageos2/capability/AndroidCapabilityBroker.kt
          grep -F '"forge.start_job"' sageos2/app/src/main/java/com/pineapple/sageos2/capability/AndroidCapabilityBroker.kt
          grep -F 'class TaskRecoveryManager' sageos2/app/src/main/java/com/pineapple/sageos2/continuity/TaskRecoveryManager.kt
          grep -F 'Do not automatically replay the previous side effect' sageos2/app/src/main/java/com/pineapple/sageos2/continuity/TaskRecoveryManager.kt
          grep -F 'taskContinuity = tasks' sageos2/app/src/main/java/com/pineapple/sageos2/runtime/SageRuntimeHost.kt
          ! grep -F 'forge.revoke' sageos2/app/src/main/java/com/pineapple/sageos2/brain/BrainToolContext.kt
          ! grep -F 'forge.pair' sageos2/app/src/main/java/com/pineapple/sageos2/brain/BrainToolContext.kt
      - name: Verify Chicken Tonight scope contract
        run: |
          set -euo pipefail
          grep -F 'data class ChickenTonightScope' sageos2/app/src/main/java/com/pineapple/sageos2/workflow/ChickenTonightScope.kt
          grep -F 'NON_NEGOTIABLE_EXCLUSIONS' sageos2/app/src/main/java/com/pineapple/sageos2/workflow/ChickenTonightScope.kt
          grep -F 'scope.isUsable(now)' sageos2/app/src/main/java/com/pineapple/sageos2/workflow/WorkflowRegistryEngine.kt
          grep -F 'val chickenTonightScope = SharedPreferencesChickenTonightScopeStore' sageos2/app/src/main/java/com/pineapple/sageos2/runtime/SageRuntimeHost.kt
          grep -F 'Panel.WORKFLOWS to "Workflows"' sageos2/app/src/main/java/com/pineapple/sageos2/MainActivity.kt
          grep -F 'Start scoped Chicken Tonight workflow' sageos2/app/src/main/java/com/pineapple/sageos2/MainActivity.kt
      - name: Verify offline wake architecture
        run: |
          grep -F 'class SherpaWakeWordEngine' sageos2/app/src/main/java/com/pineapple/sageos2/speech/SherpaWakeWordEngine.kt
          grep -F '▁S AGE' sageos2/app/src/main/java/com/pineapple/sageos2/speech/WakeProfiles.kt
          grep -F '▁S AGE ▁G LI T CH' sageos2/app/src/main/java/com/pineapple/sageos2/speech/WakeProfiles.kt
          grep -F 'SAMPLES_PER_CHUNK = 1_600' sageos2/app/src/main/java/com/pineapple/sageos2/speech/SherpaWakeWordEngine.kt
      - name: Verify continuity and diagnostics
        run: |
          grep -F 'data class TaskCheckpoint' sageos2/app/src/main/java/com/pineapple/sageos2/continuity/TaskContinuity.kt
          grep -F 'class SharedPreferencesTraceStore' sageos2/app/src/main/java/com/pineapple/sageos2/diagnostics/SharedPreferencesTraceStore.kt
          grep -F 'class PersistentRuntimeObserver' sageos2/app/src/main/java/com/pineapple/sageos2/runtime/PersistentRuntimeObserver.kt
      - name: Verify diagnostic report escape hatch
        run: |
          set -euo pipefail
          grep -F 'object DiagnosticReportRenderer' sageos2/app/src/main/java/com/pineapple/sageos2/diagnostics/DiagnosticReport.kt
          grep -F 'Privacy: conversation text' sageos2/app/src/main/java/com/pineapple/sageos2/diagnostics/DiagnosticReport.kt
          grep -F 'fun diagnosticReport(traceLimit: Int = 100): String' sageos2/app/src/main/java/com/pineapple/sageos2/runtime/SageRuntimeHost.kt
          grep -F 'diagnosticReportProvider = { diagnosticReport() }' sageos2/app/src/main/java/com/pineapple/sageos2/runtime/SageRuntimeHost.kt
          grep -F 'data object ShareDiagnosticReport' sageos2/app/src/main/java/com/pineapple/sageos2/action/FastCommand.kt
          grep -F 'FastCommand.ShareDiagnosticReport -> shareDiagnosticReport()' sageos2/app/src/main/java/com/pineapple/sageos2/action/AndroidDeviceController.kt
          grep -F '"share diagnostic report"' sageos2/app/src/main/java/com/pineapple/sageos2/core/SageCommandRouter.kt
      - name: Verify twin context and Owner Apps
        run: |
          grep -F 'class TwinContextRenderer' sageos2/app/src/main/java/com/pineapple/sageos2/identity/TwinContextRenderer.kt
          grep -F 'data class OwnerAppRecord' sageos2/app/src/main/java/com/pineapple/sageos2/apps/OwnerApps.kt
      - name: Verify wake, memory and history
        run: |
          grep -F 'data class WakeProfile' sageos2/app/src/main/java/com/pineapple/sageos2/speech/WakeProfiles.kt
          grep -F 'data class TwinMemoryRecord' sageos2/app/src/main/java/com/pineapple/sageos2/memory/TwinMemory.kt
          grep -F 'data class ConversationEntry' sageos2/app/src/main/java/com/pineapple/sageos2/memory/ConversationHistory.kt
      - name: Verify Sage owns behavioral policy and root path
        run: |
          grep -F 'val selfRestrictions: List<String>' sageos2/app/src/main/java/com/pineapple/sageos2/identity/SageCore.kt
          grep -F 'data class ExecuteProcess' sageos2/app/src/main/java/com/pineapple/sageos2/root/RootBroker.kt
          grep -F 'interface RootBrokerClient' sageos2/app/src/main/java/com/pineapple/sageos2/root/RootBroker.kt
      - name: Verify deterministic actions and speech
        run: |
          grep -F 'class AndroidFastActionEngine' sageos2/app/src/main/java/com/pineapple/sageos2/action/AndroidFastActionEngine.kt
          grep -F 'class AndroidSpeechPort' sageos2/app/src/main/java/com/pineapple/sageos2/speech/AndroidSpeechPort.kt
      - name: Verify owner cockpit is real runtime UI
        run: |
          set -euo pipefail
          cockpit=sageos2/app/src/main/java/com/pineapple/sageos2/MainActivity.kt
          grep -F 'private enum class Panel { CHAT, CORE, HEALTH, TASKS, DIAGNOSTICS, APPS, MODES, WORKFLOWS }' "$cockpit"
          grep -F 'host.core.replace' "$cockpit"
          grep -F 'host.recoverableTasks()' "$cockpit"
          grep -F 'host.traces.recent(100)' "$cockpit"
          grep -F 'host.ownerApps.upsert' "$cockpit"
          grep -F 'host.modes.activate' "$cockpit"
          grep -F 'com.pineapple.sageos2.MainActivity' sageos2/app/src/main/AndroidManifest.xml
      - name: Verify authority component contract
        run: |
          manifest=sageos2/app/src/main/AndroidManifest.xml
          for component in com.pineapple.sageos2.MainActivity com.pineapple.sage.SageAccessibilityService com.pineapple.sage.SageNotificationListener com.pineapple.sage.SageVoiceService com.pineapple.sage.SageDeviceAdminReceiver com.pineapple.sage.SageBootReceiver com.pineapple.sage.SageAssistActivity com.pineapple.sage.SageVoiceInteractionService com.pineapple.sage.SageVoiceInteractionSessionService com.pineapple.sage.SageSherpaRecognitionService; do grep -F "android:name=\"$component\"" "$manifest"; done
      - name: Verify core, root wire tests, compile native Brain, and build debug APK
        run: gradle -p sageos2 testDebugUnitTest assembleDebug --stacktrace
      - name: Verify arm64 Brain and wake runtimes are packaged without other ABIs
        run: |
          set -euo pipefail
          APK=sageos2/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libsage-brain.so'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libsherpa-onnx-jni.so'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libonnxruntime.so'
          ! unzip -l "$APK" | grep -E 'lib/(x86|x86_64|armeabi-v7a)/'
      - uses: actions/upload-artifact@v4
        with: { name: sageos2-debug, path: sageos2/app/build/outputs/apk/debug/app-debug.apk, if-no-files-found: error }
