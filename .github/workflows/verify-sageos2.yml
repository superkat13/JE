name: Verify SageOS 2

on:
  push:
    branches: [sageos-2]
    paths:
      - 'sageos2/**'
      - 'SAGEOS2_MASTER_PLAN.md'
      - 'SAGEOS2_CONTINUITY.md'
      - 'SAGEOS2_ROOT_BROKER.md'
      - '.github/workflows/verify-sageos2.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Reject removed Shizuku architecture
        run: |
          set -euo pipefail
          if grep -Rni --exclude='SAGEOS2_MASTER_PLAN.md' --exclude='SAGEOS2_CONTINUITY.md' --exclude='verify-sageos2.yml' 'shizuku' sageos2; then
            echo 'Shizuku reference returned to SageOS 2 source'
            exit 1
          fi
          ! grep -qi 'shizuku' sageos2/app/src/main/AndroidManifest.xml
      - name: Verify root broker contract exists without fake activation
        run: |
          set -euo pipefail
          grep -F 'interface RootBrokerClient' sageos2/app/src/main/java/com/pineapple/sageos2/root/RootBroker.kt
          grep -F 'ROOT_BROKER_UNAVAILABLE' sageos2/app/src/main/java/com/pineapple/sageos2/root/RootBroker.kt
          grep -F 'Capability.SAGEOS_ROOT_BROKER to rootBrokerStatus()' sageos2/app/src/main/java/com/pineapple/sageos2/capability/AndroidCapabilityBroker.kt
      - name: Verify authority and assistant component contract
        run: |
          set -euo pipefail
          manifest=sageos2/app/src/main/AndroidManifest.xml
          for component in \
            com.pineapple.sage.MainActivity \
            com.pineapple.sage.SageAccessibilityService \
            com.pineapple.sage.SageNotificationListener \
            com.pineapple.sage.SageVoiceService \
            com.pineapple.sage.SageDeviceAdminReceiver \
            com.pineapple.sage.SageBootReceiver \
            com.pineapple.sage.SageAssistActivity \
            com.pineapple.sage.SageVoiceInteractionService \
            com.pineapple.sage.SageVoiceInteractionSessionService \
            com.pineapple.sage.SageSherpaRecognitionService; do
            grep -F "android:name=\"$component\"" "$manifest"
          done
      - name: Verify core and build debug APK
        run: gradle -p sageos2 testDebugUnitTest assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sageos2-debug
          path: sageos2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
